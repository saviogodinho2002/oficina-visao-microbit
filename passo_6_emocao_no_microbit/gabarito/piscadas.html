<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Human</title>
    <meta name="viewport" content="width=device-width" id="viewport">
    <meta name="keywords" content="Human">
    <meta name="description" content="Human: Demo; Author: Vladimir Mandic <https://github.com/vladmandic>">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="shortcut icon" href="../../favicon.ico" type="image/x-icon">
    <style>
      @font-face { font-family: 'Lato'; font-display: swap; font-style: normal; font-weight: 100; src: local('Lato'), url('../../assets/lato-light.woff2') }
      body { font-family: 'Lato', 'Segoe UI'; font-size: 16px; font-variant: small-caps; margin: 0; background: black; color: white; overflow: hidden; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <canvas id="canvas" style="margin: 0 auto; width: 100%"></canvas>
    <button id="conectar" style="position: fixed; top: 12px; right: 12px; font-size: 20px; padding: 8px 16px">Conectar micro:bit</button>
    <pre id="log" style="padding: 8px; position: fixed; bottom: 0"></pre>
    <script type="module">
      import * as H from '../../dist/human.esm.js'; // equivalent of import @vladmandic/Human

      const humanConfig = { // user configuration for human, used to fine-tune behavior
        modelBasePath: '../../models', // models can be loaded directly from cdn as well
        filter: { enabled: true, equalization: true, flip: false },
        face: { enabled: true, detector: { rotation: false }, mesh: { enabled: true }, attention: { enabled: false }, iris: { enabled: true }, description: { enabled: false }, emotion: { enabled: true } },
        body: { enabled: false },
        hand: { enabled: false },
        gesture: { enabled: false },
        object: { enabled: false },
        segmentation: { enabled: false },
      };
      const human = new H.Human(humanConfig); // create instance of human with overrides from user configuration
      const canvas = document.getElementById('canvas'); // output canvas to draw both webcam and detection results

      // OFICINA: pontos da malha usados (mesma numeracao do MediaPipe FaceMesh)
      // ordem: [canto externo, canto interno, palpebra de cima, palpebra de baixo]
      const OLHO_DIR = [33, 133, 159, 145];
      const OLHO_ESQ = [263, 362, 386, 374];
      const LIMIAR_RAZAO = 0.20; // razao abaixo disso = olho fechado
      let piscadas = 0;
      let olhoFechado = false;

      function distancia(a, b) { // distancia entre dois pontos [x, y]
        return Math.hypot(a[0] - b[0], a[1] - b[1]);
      }

      function razaoAberturaOlho(mesh, olho) { // abertura dividida pela largura: nao depende da distancia ate a camera
        const abertura = distancia(mesh[olho[2]], mesh[olho[3]]);
        const largura = distancia(mesh[olho[0]], mesh[olho[1]]);
        return abertura / largura;
      }

      function escrever(texto, linha) { // escreve no canto de cima do canvas
        const ctx = canvas.getContext('2d');
        ctx.font = 'bold 36px sans-serif';
        ctx.lineWidth = 6;
        ctx.strokeStyle = 'black';
        ctx.strokeText(texto, 20, 50 * linha);
        ctx.fillStyle = 'yellow';
        ctx.fillText(texto, 20, 50 * linha);
      }

      function contarPiscadas() {
        const rosto = human.result.face[0];
        if (!rosto || !rosto.mesh || rosto.mesh.length < 468) return; // sem rosto na tela
        const razao = (razaoAberturaOlho(rosto.mesh, OLHO_DIR) + razaoAberturaOlho(rosto.mesh, OLHO_ESQ)) / 2;
        if (razao < LIMIAR_RAZAO) {
          olhoFechado = true;
        } else if (olhoFechado) { // estava fechado e abriu: conta uma piscada
          piscadas++;
          olhoFechado = false;
        }
        escrever(`Piscadas: ${piscadas}`, 1);
        escrever(`Razão: ${razao.toFixed(2)}`, 2);
      }

      // OFICINA: rotulos que o modelo de emocao devolve (src/gear/emotion.ts) traduzidos
      const EMOCOES = { angry: 'raiva', disgust: 'nojo', fear: 'medo', happy: 'feliz', sad: 'triste', surprise: 'surpresa', neutral: 'neutro' };
      let emocaoAtual = '';

      function lerEmocao() {
        const rosto = human.result.face[0];
        if (!rosto || !rosto.emotion || rosto.emotion.length === 0) return;
        emocaoAtual = EMOCOES[rosto.emotion[0].emotion]; // a lista vem ordenada, maior score primeiro
        escrever(`Emoção: ${emocaoAtual}`, 3);
        enviarEmocao(emocaoAtual);
      }

      // OFICINA: envio pela serial (trecho gerado com LLM na oficina)
      const botao = document.getElementById('conectar');
      let escritor = null; // writer da porta serial aberta
      let ultimaEnviada = '';

      botao.onclick = async () => {
        if (!('serial' in navigator)) {
          botao.textContent = 'Use Chrome ou Edge (sem Web Serial)';
          return;
        }
        try {
          const porta = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x0d28 }] }); // 0x0d28 = interface USB do micro:bit
          await porta.open({ baudRate: 115200 });
          escritor = porta.writable.getWriter();
          ultimaEnviada = '';
          botao.textContent = 'micro:bit conectado';
        } catch (erro) {
          botao.textContent = 'Falhou: ' + erro.message;
        }
      };

      async function enviarEmocao(emocao) {
        if (!escritor || emocao === ultimaEnviada) return; // so envia quando muda
        ultimaEnviada = emocao;
        try {
          await escritor.write(new TextEncoder().encode(emocao + '\n'));
        } catch (erro) {
          escritor = null;
          botao.textContent = 'Desconectou, clique para conectar';
        }
      }

      async function drawLoop() { // main screen refresh loop
        const interpolated = human.next(); // get smoothened result using last-known results which are continously updated based on input webcam video
        human.draw.canvas(human.webcam.element, canvas); // draw webcam video to screen canvas // better than using procesed image as this loop happens faster than processing loop
        await human.draw.all(canvas, interpolated); // draw labels, boxes, lines, etc.
        contarPiscadas(); // OFICINA
        lerEmocao(); // OFICINA
        setTimeout(drawLoop, 30); // use to slow down refresh from max refresh rate to target of 1000/30 ~ 30 fps
      }

      async function main() { // main entry point
        document.getElementById('log').innerHTML = `human version: ${human.version} | tfjs version: ${human.tf.version['tfjs-core']}<br>platform: ${human.env.platform} | agent ${human.env.agent}`;
        await human.webcam.start({ crop: true }); // find webcam and start it
        human.video(human.webcam.element); // instruct human to continously detect video frames
        canvas.width = human.webcam.width; // set canvas resolution to input webcam native resolution
        canvas.height = human.webcam.height;
        canvas.onclick = async () => { // pause when clicked on screen and resume on next click
          if (human.webcam.paused) await human.webcam.play();
          else human.webcam.pause();
        };
        await drawLoop(); // start draw loop
      }

      window.onload = main;
    </script>  
  </body>
</html>
